<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Orbit Viewer</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
    #camera-video {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1; pointer-events: none;
    }
    #canvas-container {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 2; pointer-events: none;
    }
    #ui-overlay {
      position: absolute; top: 12px; left: 12px; z-index: 9999;
      display: flex; gap: 8px; align-items: center;
    }
    .btn {
      padding: 10px 18px; font-size: 14px; font-weight: bold; border-radius: 6px;
      border: none; cursor: pointer; color: white;
    }
    #btn-start { background-color: #007aff; }
    #btn-stop { background-color: #ff3b30; display: none; }
    #timer-display {
      background: rgba(0,0,0,0.7); color: #fff; padding: 8px 12px;
      border-radius: 6px; font-family: monospace; font-size: 14px;
    }
    #log-box {
      position: absolute; bottom: 20px; left: 12px;
      font-size: 12px; color: #00ff66; background: rgba(0, 0, 0, 0.75);
      padding: 10px 14px; border-radius: 6px; z-index: 9999;
      font-family: monospace; line-height: 1.4; pointer-events: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <video id="camera-video" autoplay playsinline webkit-playsinline muted></video>
  <div id="canvas-container"></div>
  <div id="log-box">Status: Ready</div>

  <div id="ui-overlay">
    <button id="btn-start" class="btn">START AR</button>
    <button id="btn-stop" class="btn" style="display:none;">STOP & SAVE</button>
    <div id="timer-display">00.0s</div>
  </div>

  <script>
    var logBox = document.getElementById('log-box');
    var logBuffer = [];
    var isRecording = false;
    var startTime = 0;
    var timerInterval = null;

    var currentOrientation = { alpha: 0, beta: 0, gamma: 0 };
    var currentMotion = { x: 0, y: 0, z: 0 };
    var camera, scene, renderer;
    var targetCenter = new THREE.Vector3(0, 0, 0);

    var radius = 30.0;
    var baseHeading = null;
    var baseBeta = null;

    // カメラ位置を端末の向きに合わせて機体の周囲に配置
    function updateCameraOrbit() {
      if (!camera || !isRecording) return;

      var heading = currentOrientation.alpha; // 方位角
      var beta    = currentOrientation.beta;  // 前後傾き

      if (baseHeading === null && heading !== null && !isNaN(heading)) {
        baseHeading = heading;
      }
      if (baseBeta === null && beta !== null && !isNaN(beta)) {
        baseBeta = beta;
      }

      var deltaHeading = (heading - (baseHeading || 0));
      var deltaBeta    = (beta - (baseBeta || 0));

      // iPadを持って右に回ったら、カメラも機体の右側へ公転
      var theta = THREE.MathUtils.degToRad(-deltaHeading);

      // 上下見下ろし（基準90度からiPadの傾き変化分を反映）
      var phiAngle = 90 - deltaBeta;
      phiAngle = THREE.MathUtils.clamp(phiAngle, 30, 150);
      var phi = THREE.MathUtils.degToRad(phiAngle);

      camera.position.x = targetCenter.x + radius * Math.sin(phi) * Math.sin(theta);
      camera.position.y = targetCenter.y + radius * Math.cos(phi);
      camera.position.z = targetCenter.z + radius * Math.sin(phi) * Math.cos(theta);

      camera.lookAt(targetCenter);
    }

    function handleOrientation(e) {
      // iOS では webkitCompassHeading がコンパス方位として正確に取れる場合がある
      var alphaVal = 0;
      if (typeof e.webkitCompassHeading !== 'undefined' && e.webkitCompassHeading !== null) {
        alphaVal = e.webkitCompassHeading;
      } else if (e.alpha !== null && !isNaN(e.alpha)) {
        alphaVal = e.alpha;
      }

      currentOrientation.alpha = alphaVal;
      currentOrientation.beta  = (e.beta  !== null && !isNaN(e.beta))  ? e.beta  : 0;
      currentOrientation.gamma = (e.gamma !== null && !isNaN(e.gamma)) ? e.gamma : 0;
    }

    function handleMotion(e) {
      if (e.rotationRate) {
        currentMotion.x = (e.rotationRate.beta  !== null && !isNaN(e.rotationRate.beta))  ? e.rotationRate.beta  : 0;
        currentMotion.y = (e.rotationRate.gamma !== null && !isNaN(e.rotationRate.gamma)) ? e.rotationRate.gamma : 0;
        currentMotion.z = (e.rotationRate.alpha !== null && !isNaN(e.rotationRate.alpha)) ? e.rotationRate.alpha : 0;
      }
    }

    function sendAllLogs() {
      if (logBuffer.length === 0) return;
      if (window.FileMaker) {
        var payload = JSON.stringify({ logs: logBuffer });
        FileMaker.PerformScript('Save_SensorLogs', payload);
      }
      logBuffer = [];
    }

    function startCameraDirectly() {
      var video = document.getElementById('camera-video');
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;

      navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } },
        audio: false
      }).then(function(stream) {
        video.srcObject = stream;
        video.play();
      }).catch(function(err) {
        if (logBox) logBox.innerHTML = 'Cam Err: ' + err.name;
      });
    }

    async function onStartClicked() {
      // 1. 直ちにカメラ起動
      startCameraDirectly();

      // 2. iOS センサー権限を同期的に許可取得
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          var oriPerm = await DeviceOrientationEvent.requestPermission();
          if (oriPerm !== 'granted') {
            if (logBox) logBox.innerHTML = 'Orientation permission denied';
          }
        } catch(e) {}
      }
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        try {
          await DeviceMotionEvent.requestPermission();
        } catch(e) {}
      }

      // 3. 基準角度リセット
      baseHeading = null;
      baseBeta = null;

      window.addEventListener('deviceorientation', handleOrientation, true);
      window.addEventListener('devicemotion', handleMotion, true);

      isRecording = true;
      startTime = performance.now();
      logBuffer = [];

      document.getElementById('btn-start').style.display = 'none';
      document.getElementById('btn-stop').style.display = 'inline-block';

      timerInterval = setInterval(function() {
        if (!isRecording) return;
        var elapsed = (performance.now() - startTime) / 1000;
        document.getElementById('timer-display').innerText = elapsed.toFixed(1) + 's';

        if (logBox) {
          logBox.innerHTML = 
            'Time: ' + elapsed.toFixed(1) + 's<br>' +
            'Heading: ' + currentOrientation.alpha.toFixed(1) + '<br>' +
            'Beta: ' + currentOrientation.beta.toFixed(1) + '<br>' +
            'Gyro X: ' + currentMotion.x.toFixed(2) + '<br>' +
            'Gyro Z: ' + currentMotion.z.toFixed(2);
        }

        logBuffer.push({
          time: new Date().toISOString(),
          elapsed: Number(elapsed.toFixed(2)),
          alpha: Number(currentOrientation.alpha.toFixed(2)),
          beta: Number(currentOrientation.beta.toFixed(2)),
          gamma: Number(currentOrientation.gamma.toFixed(2)),
          gyroX: Number(currentMotion.x.toFixed(2)),
          gyroY: Number(currentMotion.y.toFixed(2)),
          gyroZ: Number(currentMotion.z.toFixed(2))
        });
      }, 500);
    }

    function onStopClicked() {
      isRecording = false;
      clearInterval(timerInterval);
      window.removeEventListener('deviceorientation', handleOrientation);
      window.removeEventListener('devicemotion', handleMotion);

      sendAllLogs();

      document.getElementById('btn-start').style.display = 'inline-block';
      document.getElementById('btn-stop').style.display = 'none';
      if (logBox) {
        logBox.innerHTML = 'Status: Data Saved to FileMaker';
      }
    }

    function init() {
      var container = document.getElementById('canvas-container');
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 2000);
      camera.position.set(0, 0, radius);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setClearColor(0x000000, 0);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.outputEncoding = THREE.sRGBEncoding;
      container.appendChild(renderer.domElement);

      var ambLight = new THREE.AmbientLight(0xffffff, 1.8);
      scene.add(ambLight);
      var dLight = new THREE.DirectionalLight(0xffffff, 1.4);
      dLight.position.set(15, 30, 20);
      scene.add(dLight);

      var loader = new THREE.GLTFLoader();
      loader.load('./model.glb', function(gltf) {
        var model = gltf.scene;
        var box = new THREE.Box3().setFromObject(model);
        var center = box.getCenter(new THREE.Vector3());
        
        model.position.sub(center);
        scene.add(model);
        camera.lookAt(targetCenter);
      }, undefined, function(err) {
        if (logBox) logBox.innerHTML = 'GLB load error';
      });

      // 毎フレーム updateCameraOrbit を呼んでスムーズに連動させる
      function animate() {
        requestAnimationFrame(animate);
        updateCameraOrbit();
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', function() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      document.getElementById('btn-start').addEventListener('click', onStartClicked);
      document.getElementById('btn-stop').addEventListener('click', onStopClicked);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
