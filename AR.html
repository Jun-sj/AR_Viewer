<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Experiment - DeviceOrientation</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
    #camera-video {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; z-index: 1;
    }
    #canvas-container {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 2; pointer-events: none; /* 指操作は無効化し、端末姿勢に追従 */
    }
    #ui-overlay {
      position: absolute; top: 12px; left: 12px; z-index: 9999;
      display: flex; gap: 8px; align-items: center;
    }
    .btn {
      padding: 10px 18px; font-size: 14px; font-weight: bold; border-radius: 6px;
      border: none; cursor: pointer; color: white;
    }
    #btn-start { background-color: #007aff; }
    #btn-stop { background-color: #ff3b30; display: none; }
    #timer-display {
      background: rgba(0,0,0,0.7); color: #fff; padding: 8px 12px;
      border-radius: 6px; font-family: monospace; font-size: 14px;
    }
    #log-box {
      position: absolute; bottom: 20px; left: 12px;
      font-size: 12px; color: #00ff66; background: rgba(0, 0, 0, 0.75);
      padding: 10px 14px; border-radius: 6px; z-index: 9999;
      font-family: monospace; line-height: 1.4; pointer-events: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <video id="camera-video" autoplay playsinline muted></video>
  <div id="canvas-container"></div>
  <div id="log-box">Status: Ready</div>

  <div id="ui-overlay">
    <button id="btn-start" class="btn" onclick="startSession()">START AR</button>
    <button id="btn-stop" class="btn" onclick="stopSession()">STOP & SAVE</button>
    <div id="timer-display">00.0s</div>
  </div>

  <script>
    var logBox = document.getElementById('log-box');
    var logBuffer = [];
    var isRecording = false;
    var startTime = 0;
    var timerInterval = null;

    var currentOrientation = { alpha: 0, beta: 0, gamma: 0 };
    var currentMotion = { x: 0, y: 0, z: 0 };
    var camera, scene, renderer;
    var initialAlpha = null; // 開始時の方角オフセット

    // iOSの姿勢角（Alpha/Beta/Gamma）をThree.jsのカメラ回転に反映
    function updateCameraRotation() {
      if (!camera) return;

      var alpha = currentOrientation.alpha ? THREE.MathUtils.degToRad(currentOrientation.alpha) : 0; // Z
      var beta  = currentOrientation.beta  ? THREE.MathUtils.degToRad(currentOrientation.beta)  : 0; // X
      var gamma = currentOrientation.gamma ? THREE.MathUtils.degToRad(currentOrientation.gamma) : 0; // Y

      // 開始時の正面方向をリセット（最初の向きを正面とする）
      if (initialAlpha === null && currentOrientation.alpha !== 0) {
        initialAlpha = alpha;
      }
      var adjustedAlpha = alpha - (initialAlpha || 0);

      var euler = new THREE.Euler();
      // iOS DeviceOrientation -> Three.js 座標系変換 (Z-X-Y順)
      euler.set(beta, adjustedAlpha, -gamma, 'YXZ');
      camera.quaternion.setFromEuler(euler);
    }

    function handleOrientation(e) {
      currentOrientation.alpha = (e.alpha !== null && !isNaN(e.alpha)) ? e.alpha : 0;
      currentOrientation.beta  = (e.beta  !== null && !isNaN(e.beta))  ? e.beta  : 0;
      currentOrientation.gamma = (e.gamma !== null && !isNaN(e.gamma)) ? e.gamma : 0;
      updateCameraRotation();
    }

    function handleMotion(e) {
      if (e.rotationRate) {
        currentMotion.x = (e.rotationRate.beta  !== null && !isNaN(e.rotationRate.beta))  ? e.rotationRate.beta  : 0;
        currentMotion.y = (e.rotationRate.gamma !== null && !isNaN(e.rotationRate.gamma)) ? e.rotationRate.gamma : 0;
        currentMotion.z = (e.rotationRate.alpha !== null && !isNaN(e.rotationRate.alpha)) ? e.rotationRate.alpha : 0;
      }
    }

    function sendAllLogs() {
      if (logBuffer.length === 0) return;
      if (window.FileMaker) {
        var payload = JSON.stringify({ logs: logBuffer });
        FileMaker.PerformScript('Save_SensorLogs', payload);
      }
      logBuffer = [];
    }

    async function startCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
      try {
        var video = document.getElementById('camera-video');
        var stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
      } catch (err) {
        console.log('Camera error:', err);
      }
    }

    async function startSession() {
      // 1. センサー権限リクエスト
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        try { await DeviceMotionEvent.requestPermission(); } catch(e) {}
      }
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try { await DeviceOrientationEvent.requestPermission(); } catch(e) {}
      }

      initialAlpha = null; // 開始時の正面方向をリセット

      // 2. イベント登録
      window.addEventListener('deviceorientation', handleOrientation, true);
      window.addEventListener('devicemotion', handleMotion, true);

      // 3. カメラ開始
      await startCamera();

      // 4. タイマー・ログ開始
      isRecording = true;
      startTime = performance.now();
      logBuffer = [];

      document.getElementById('btn-start').style.display = 'none';
      document.getElementById('btn-stop').style.display = 'inline-block';

      timerInterval = setInterval(function() {
        if (!isRecording) return;
        var elapsed = (performance.now() - startTime) / 1000;
        document.getElementById('timer-display').innerText = elapsed.toFixed(1) + 's';

        if (logBox) {
          logBox.innerHTML = 
            'Time: ' + elapsed.toFixed(1) + 's<br>' +
            'Roll/Pitch: ' + currentOrientation.gamma.toFixed(1) + ' / ' + currentOrientation.beta.toFixed(1) + '<br>' +
            'Gyro X: ' + currentMotion.x.toFixed(2) + '<br>' +
            'Gyro Y: ' + currentMotion.y.toFixed(2) + '<br>' +
            'Gyro Z: ' + currentMotion.z.toFixed(2);
        }

        logBuffer.push({
          time: new Date().toISOString(),
          elapsed: Number(elapsed.toFixed(2)),
          alpha: Number(currentOrientation.alpha.toFixed(2)),
          beta: Number(currentOrientation.beta.toFixed(2)),
          gamma: Number(currentOrientation.gamma.toFixed(2)),
          gyroX: Number(currentMotion.x.toFixed(2)),
          gyroY: Number(currentMotion.y.toFixed(2)),
          gyroZ: Number(currentMotion.z.toFixed(2))
        });
      }, 500);
    }

    function stopSession() {
      isRecording = false;
      clearInterval(timerInterval);
      window.removeEventListener('deviceorientation', handleOrientation);
      window.removeEventListener('devicemotion', handleMotion);

      sendAllLogs();

      document.getElementById('btn-start').style.display = 'inline-block';
      document.getElementById('btn-stop').style.display = 'none';
      if (logBox) {
        logBox.innerHTML = 'Status: Data Saved to FileMaker';
      }
    }

    function init() {
      var container = document.getElementById('canvas-container');
      scene = new THREE.Scene();

      // カメラを原点(0, 0, 0)に配置
      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setClearColor(0x000000, 0);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.outputEncoding = THREE.sRGBEncoding;
      container.appendChild(renderer.domElement);

      var ambLight = new THREE.AmbientLight(0xffffff, 1.5);
      scene.add(ambLight);
      var dLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dLight.position.set(5, 10, 7);
      scene.add(dLight);

      // モデルをカメラの正面（Z = -2.5m の位置）に配置
      var loader = new THREE.GLTFLoader();
      loader.load('./model.glb', function(gltf) {
        var model = gltf.scene;
        var box = new THREE.Box3().setFromObject(model);
        var center = box.getCenter(new THREE.Vector3());
        model.position.sub(center); // 原点中心合わせ
        model.position.set(0, 0, -2.5); // 正面2.5m先に固定
        scene.add(model);
      }, undefined, function(err) {
        if (logBox) logBox.innerHTML = 'GLB load error';
      });

      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', function() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
